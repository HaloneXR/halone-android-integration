name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        env:
          ORG_GRADLE_PROJECT_haloneKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_haloneKeystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_haloneKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_haloneKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK after the release
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Halone-Android-Integration-$GITHUB_REF_NAME.apk"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --verify-tag --generate-notes --prerelease
          fi
